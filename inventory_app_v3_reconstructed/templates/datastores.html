{% extends "base.html" %}
{% block content %}

<div class="control-bar">
    <div class="control-group">
        <label class="text-muted small mb-0 fw-semibold text-nowrap">VMware Run:</label>
        <select id="vmwareRunFilter" class="form-select form-select-sm">
            <option value="">Latest VMware Run</option>
        </select>
    </div>
    <div class="control-group">
        <label class="text-muted small mb-0 fw-semibold text-nowrap">Hyper‑V Run:</label>
        <select id="hypervRunFilter" class="form-select form-select-sm">
            <option value="">Latest Hyper‑V Run</option>
        </select>
    </div>
    <div class="control-group">
        <div class="platform-filter">
            <span class="platform-filter-btn" data-platform="all" onclick="setPlatformFilter('all')">All</span>
            <span class="platform-filter-btn" data-platform="vmware" onclick="setPlatformFilter('vmware')">VMware</span>
            <span class="platform-filter-btn" data-platform="hyper-v" onclick="setPlatformFilter('hyper-v')">Hyper-V</span>
        </div>
    </div>
    <div class="control-group">
        <label class="text-muted small mb-0 fw-semibold text-nowrap">Environment:</label>
        <select id="envSelect" class="form-select form-select-sm" style="min-width:180px;">
            <option value="">— All Environments —</option>
        </select>
    </div>
    <div class="control-group">
        <div class="input-group input-group-sm" style="width:240px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="datastoreSearch" class="form-control" placeholder="Search datastores…">
        </div>
        <div class="dropdown d-inline-block">
            <button class="btn btn-success btn-sm dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-download me-1"></i>Export
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" onclick="exportDatastores('csv'); return false;">
                    <i class="bi bi-filetype-csv me-2"></i>CSV</a></li>
                <li><a class="dropdown-item" href="#" onclick="exportDatastores('xlsx'); return false;">
                    <i class="bi bi-file-earmark-excel me-2"></i>Excel</a></li>
            </ul>
        </div>
    </div>
</div>

<div class="table-container">
    <table class="table table-bordered custom-table">
        <thead>
            <tr>
                <th>Platform</th><th>Datastore</th><th>Cluster</th><th>vCenter</th>
                <th>Status</th><th>Accessible</th><th>Type</th><th>VMs</th>
                <th>Capacity</th><th>Used</th><th>Free</th><th>Used %</th>
                <th>Provisioned</th><th>VMs</th>
            </tr>
        </thead>
        <tbody id="datastoresTable">
            <tr><td colspan="14" class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>Loading…</div></td></tr>
        </tbody>
    </table>
</div>

<script>
    let allDatastores = [];
    let currentPlatformFilter = "all";
    let searchTerm = "";
    let currentVmwareRunId = "";
    let currentHypervRunId = "";
    let currentEnv = "";
    let envList = [];

    function toNum(v) { return (v === undefined || v === null) ? 0 : parseFloat(v) || 0; }
    function formatSize(gb) { let val = toNum(gb); if (val >= 1024) return (val / 1024).toFixed(2) + " TB"; return val.toFixed(2) + " GB"; }
    function formatProvisioned(val) { let v = toNum(val); if (v === 0) return "—"; return formatSize(v); }
    function getColor(p) { let n = toNum(p); return n > 90 ? "#dc2626" : n > 70 ? "#f97316" : "#10b981"; }

    function getPlatformIcon(platform) {
        const p = (platform || '').toLowerCase();
        if (p === 'vmware') return '<i class="bi bi-server"></i> VMware';
        if (p === 'hyper-v') return '<i class="bi bi-windows"></i> Hyper-V';
        return '<i class="bi bi-question-circle"></i> Unknown';
    }

    function populateEnvSelect() {
        const urlParams = new URLSearchParams(window.location.search);
        const vcenterParam = urlParams.get('vcenter') || "";
        envList = vcenterParam ? vcenterParam.split(',').map(s => s.trim()).filter(s => s) : [];
        currentEnv = vcenterParam;

        const envSet = new Set();
        allDatastores.forEach(ds => { if (ds.vcenter_name) envSet.add(ds.vcenter_name); });
        const select = document.getElementById('envSelect');
        if (!select) return;
        select.innerHTML = '<option value="">— All Environments —</option>';
        Array.from(envSet).sort().forEach(env => {
            const opt = document.createElement('option');
            opt.value = env;
            opt.textContent = env;
            if (envList.length === 1 && env === envList[0]) opt.selected = true;
            select.appendChild(opt);
        });
        if (envList.length > 1) {
            const opt = document.createElement('option');
            opt.value = vcenterParam;
            opt.textContent = "Multiple (" + vcenterParam + ")";
            opt.selected = true;
            select.appendChild(opt);
        } else if (envList.length === 1 && !envSet.has(envList[0])) {
            const opt = document.createElement('option');
            opt.value = envList[0];
            opt.textContent = envList[0] + " (filtered)";
            opt.selected = true;
            select.appendChild(opt);
        }
    }

    function onEnvChange() {
        const select = document.getElementById('envSelect');
        if (!select) return;
        const newEnv = select.value;
        const url = new URL(window.location.href);
        if (newEnv) url.searchParams.set('vcenter', newEnv);
        else url.searchParams.delete('vcenter');
        window.location.href = url.toString();
    }

    window.setPlatformFilter = function(platform) {
        currentPlatformFilter = platform;
        document.querySelectorAll('.platform-filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.platform === platform);
        });
        renderTable();
    };

    function filterTable() {
        searchTerm = document.getElementById('datastoreSearch').value.toLowerCase();
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('datastoresTable');
        if (!tbody) return;

        let filtered = allDatastores.filter(ds => {
            if (currentPlatformFilter !== 'all') {
                let p = (ds.platform || '').toLowerCase();
                if (p === 'hyper-v') p = 'hyper-v';
                if (p !== currentPlatformFilter.toLowerCase()) return false;
            }
            if (envList.length > 0) {
                if (!envList.includes(ds.vcenter_name)) return false;
            }
            if (searchTerm) {
                const name = (ds.datastore_name || '').toLowerCase();
                const cluster = (ds.cluster_name || '').toLowerCase();
                const vcenter = (ds.vcenter_name || '').toLowerCase();
                if (!name.includes(searchTerm) && !cluster.includes(searchTerm) && !vcenter.includes(searchTerm)) return false;
            }
            return true;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="14" class="text-center text-muted py-3">No datastores found</div></td></tr>';
            return;
        }

        let html = '';
        filtered.forEach(ds => {
            const platformIcon = getPlatformIcon(ds.platform);
            const usedPercent = toNum(ds.used_gb) / (toNum(ds.capacity_gb) || 1) * 100;
            const capacity = formatSize(ds.capacity_gb);
            const used = formatSize(ds.used_gb);
            const free = formatSize(ds.free_gb);
            const provisioned = formatProvisioned(ds.provisioned_gb);
            const accessible = ds.is_accessible === 1 ? '<span class="text-success">Yes</span>' : '<span class="text-danger">No</span>';
            const vmsLink = `/datastore_vms?datastore=${encodeURIComponent(ds.datastore_name)}&cluster=${encodeURIComponent(ds.cluster_name || '')}&run_id_vmware=${currentVmwareRunId}&run_id_hyperv=${currentHypervRunId}&vcenter=${encodeURIComponent(currentEnv)}`;

            html += `<tr>
                <td>${platformIcon}</td>
                <td><a href="${vmsLink}" class="text-primary fw-semibold">${escapeHtml(ds.datastore_name)}</a></td>
                <td>${escapeHtml(ds.cluster_name || '-')}</td>
                <td>${escapeHtml(ds.vcenter_name || '-')}</td>
                <td>${escapeHtml(ds.status || '-')}</td>
                <td>${accessible}</td>
                <td>${escapeHtml(ds.type || '-')}</td>
                <td>${toNum(ds.num_vms)}</td>
                <td>${capacity}</td><td>${used}</td><td>${free}</td>
                <td>${usedPercent.toFixed(1)}%<div class="progress-micro"><div class="progress-fill-micro" style="width:0;background:${getColor(usedPercent)};" data-target-width="${Math.min(100,usedPercent)}%"></div></div></td>
                <td>${provisioned}</td>
                <td><a href="${vmsLink}" class="btn btn-xs btn-outline-info">View VMs</a></td>
            </tr>`;
        });
        tbody.innerHTML = html;
        animateProgressBars(tbody);
    }

    function animateProgressBars(container) {
        const bars = container.querySelectorAll('.progress-fill-micro[data-target-width]');
        requestAnimationFrame(() => { requestAnimationFrame(() => { bars.forEach(bar => { bar.style.width = bar.dataset.targetWidth; }); }); });
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

    window.exportDatastores = function(fmt) {
        const vmwareRunId = document.getElementById("vmwareRunFilter")?.value || "";
        const hypervRunId = document.getElementById("hypervRunFilter")?.value || "";
        const urlParams = new URLSearchParams(window.location.search);
        const vcenterParam = urlParams.get('vcenter') || "";
        const params = [];
        if (vmwareRunId) params.push(`run_id_vmware=${vmwareRunId}`);
        if (hypervRunId) params.push(`run_id_hyperv=${hypervRunId}`);
        if (vcenterParam) params.push(`vcenter=${encodeURIComponent(vcenterParam)}`);
        params.push(`format=${fmt}`);
        window.location.href = `/api/datastores/export?${params.join('&')}`;
    };

    function loadVmwareRuns() {
        return fetch("/api/unified/runs").then(res => res.json()).then(data => {
            const vmSel = document.getElementById("vmwareRunFilter");
            if (data.runs && Array.isArray(data.runs)) {
                const vmRuns = data.runs.filter(r => r.platform === 'VMware');
                if (vmSel) {
                    vmSel.innerHTML = '<option value="">Latest VMware Run</option>';
                    vmRuns.forEach(run => { vmSel.innerHTML += `<option value="${run.run_id}">Run ${run.run_id} - ${run.run_timestamp || 'N/A'}</option>`; });
                    const urlParams = new URLSearchParams(window.location.search);
                    const runId = urlParams.get('run_id_vmware');
                    if (runId) vmSel.value = runId;
                    vmSel.onchange = () => loadDatastoresData();
                }
            }
        }).catch(err => console.error("Failed to load VMware runs:", err));
    }

    function loadHypervRuns() {
        return fetch("/api/unified/runs").then(res => res.json()).then(data => {
            const hvSel = document.getElementById("hypervRunFilter");
            if (data.runs && Array.isArray(data.runs)) {
                const hvRuns = data.runs.filter(r => r.platform === 'Hyper-V');
                if (hvSel) {
                    hvSel.innerHTML = '<option value="">Latest Hyper-V Run</option>';
                    hvRuns.forEach(run => { hvSel.innerHTML += `<option value="${run.run_id}">Run ${run.run_id} - ${run.run_timestamp || 'N/A'}</option>`; });
                    const urlParams = new URLSearchParams(window.location.search);
                    const runId = urlParams.get('run_id_hyperv');
                    if (runId) hvSel.value = runId;
                    hvSel.onchange = () => loadDatastoresData();
                }
            }
        }).catch(err => console.error("Failed to load Hyper-V runs:", err));
    }

    function loadDatastoresData() {
        const vmwareRunId = document.getElementById("vmwareRunFilter")?.value || "";
        const hypervRunId = document.getElementById("hypervRunFilter")?.value || "";
        currentVmwareRunId = vmwareRunId;
        currentHypervRunId = hypervRunId;

        const urlParams = new URLSearchParams(window.location.search);
        const vcenterParam = urlParams.get('vcenter') || "";
        envList = vcenterParam ? vcenterParam.split(',').map(s => s.trim()).filter(s => s) : [];
        currentEnv = vcenterParam;

        const tbody = document.getElementById("datastoresTable");
        if (tbody) tbody.innerHTML = '<tr><td colspan="14" class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>Loading datastores…</div></td></tr>';

        let url = "/api/datastores";
        const params = [];
        if (vmwareRunId) params.push(`run_id_vmware=${vmwareRunId}`);
        if (hypervRunId) params.push(`run_id_hyperv=${hypervRunId}`);
        if (vcenterParam) params.push(`vcenter=${encodeURIComponent(vcenterParam)}`);
        if (params.length) url += '?' + params.join('&');

        fetch(url).then(res => res.json()).then(data => {
            if (data.data && Array.isArray(data.data)) allDatastores = data.data;
            else if (Array.isArray(data)) allDatastores = data;
            else allDatastores = [];
            populateEnvSelect();
            renderTable();
        }).catch(err => { console.error("Error loading datastores:", err); if (tbody) tbody.innerHTML = '<tr><td colspan="14" class="text-center text-danger py-3">Failed to load datastores</div></td></tr>'; });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const allBtn = document.querySelector('.platform-filter-btn[data-platform="all"]');
        if (allBtn) allBtn.classList.add('active');
        const searchInput = document.getElementById('datastoreSearch');
        if (searchInput) searchInput.addEventListener('input', filterTable);
        const envSelect = document.getElementById('envSelect');
        if (envSelect) envSelect.addEventListener('change', onEnvChange);
        Promise.all([loadVmwareRuns(), loadHypervRuns()]).then(() => loadDatastoresData());
    });
</script>
{% endblock %}
