{% extends "base.html" %}
{% block content %}

<div class="control-bar">
    <div class="control-group" id="runPickerBox"></div>
    <div class="control-group">
        <div class="platform-filter" id="platformFilter"></div>
    </div>
    <div class="control-group">
        <label class="text-muted small mb-0 fw-semibold text-nowrap">Environment:</label>
        <select id="envSelect" class="form-select form-select-sm" style="min-width:180px;">
            <option value="">— All Environments —</option>
        </select>
    </div>
    <div class="control-group">
        <div class="input-group input-group-sm" style="width:240px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="datastoreSearch" class="form-control" placeholder="Search datastores…">
        </div>
        <div class="dropdown d-inline-block">
            <button class="btn btn-success btn-sm dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-download me-1"></i>Export
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" onclick="exportDatastores('csv'); return false;">
                    <i class="bi bi-filetype-csv me-2"></i>CSV</a></li>
                <li><a class="dropdown-item" href="#" onclick="exportDatastores('xlsx'); return false;">
                    <i class="bi bi-file-earmark-excel me-2"></i>Excel</a></li>
            </ul>
        </div>
    </div>
</div>

<div id="clusterBanner" class="alert alert-info py-1 px-3 small align-items-center justify-content-between" style="display:none;">
    <span><i class="bi bi-funnel me-1"></i>Cluster filter: <b id="clusterBannerName"></b></span>
    <a href="#" id="clusterBannerClear" class="ms-3">Show all clusters</a>
</div>

<div class="table-container">
    <table class="table table-bordered custom-table">
        <thead>
            <tr>
                <th>Platform</th><th>Datastore</th><th>Cluster</th><th>Environment</th><th>Site</th>
                <th>Status</th><th>Accessible</th><th>Type</th><th>VMs</th>
                <th>Capacity</th><th>Used</th><th>Free</th><th>Used %</th>
                <th>Provisioned</th><th>Open</th>
            </tr>
        </thead>
        <tbody id="datastoresTable">
            <tr><td colspan="15" class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>Loading…</td></tr>
        </tbody>
    </table>
</div>

<script src="{{ url_for('static', filename='js/hv_common.js') }}"></script>
<script>
(function () {
    let allDatastores = [];
    let searchTerm = "";
    const COLS = 15;
    const clusterParam = new URLSearchParams(window.location.search).get('cluster') || "";

    function renderTable() {
        const tbody = document.getElementById('datastoresTable');
        const filtered = allDatastores.filter(ds => {
            if (!HV.rowMatches(ds, 'vcenter_name')) return false;
            if (searchTerm) {
                const hay = [ds.datastore_name, ds.cluster_name, ds.vcenter_name, ds.site_code].map(x => (x || '').toLowerCase());
                if (!hay.some(x => x.includes(searchTerm))) return false;
            }
            return true;
        });
        if (!filtered.length) {
            tbody.innerHTML = `<tr><td colspan="${COLS}" class="text-center text-muted py-3">No datastores found</td></tr>`;
            return;
        }
        const esc = HV.esc, n = HV.toNum;
        tbody.innerHTML = filtered.map(ds => {
            const used = n(ds.used_gb), cap = n(ds.capacity_gb);
            const usedPct = cap > 0 ? used / cap * 100 : 0;
            const prov = n(ds.provisioned_gb) === 0 ? "—" : HV.fmtGB(ds.provisioned_gb);
            const acc = (ds.is_accessible === null || ds.is_accessible === undefined) ? '<span class="text-muted">-</span>'
                      : Number(ds.is_accessible) === 1 ? '<span class="text-success">Yes</span>' : '<span class="text-danger">No</span>';
            const vmsUrl = HV.pageUrl('/datastore_vms', { datastore: ds.datastore_name, cluster: ds.cluster_name || '', vcenter: ds.vcenter_name });
            return `<tr>
                <td>${HV.platformCell(ds._pkey)}</td>
                <td><a href="${vmsUrl}" class="text-primary fw-semibold">${esc(ds.datastore_name)}</a></td>
                <td>${esc(ds.cluster_name || '-')}</td>
                <td>${esc(ds.vcenter_name || '-')}</td>
                <td>${esc(ds.site_code || '-')}</td>
                <td>${esc(ds.status || '-')}</td>
                <td>${acc}</td>
                <td>${esc(ds.type || '-')}</td>
                <td>${n(ds.num_vms)}</td>
                <td>${HV.fmtGB(cap)}</td><td>${HV.fmtGB(used)}</td><td>${HV.fmtGB(ds.free_gb)}</td>
                <td>${HV.bar(usedPct)}</td>
                <td>${prov}</td>
                <td><a href="${vmsUrl}" class="btn btn-xs btn-outline-info">View VMs</a></td>
            </tr>`;
        }).join('');
        HV.animateBars(tbody);
    }

    function loadData() {
        const tbody = document.getElementById("datastoresTable");
        tbody.innerHTML = `<tr><td colspan="${COLS}" class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>Loading datastores…</td></tr>`;
        fetch("/api/datastores" + HV.apiQuery({ cluster: clusterParam }))
            .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
            .then(data => {
                allDatastores = HV.tagRows(Array.isArray(data) ? data : (Array.isArray(data.data) ? data.data : []));
                HV.renderPlatformFilter(allDatastores);
                HV.populateEnvSelect(allDatastores, 'vcenter_name');
                renderTable();
            })
            .catch(err => {
                console.error("Error loading datastores:", err);
                tbody.innerHTML = `<tr><td colspan="${COLS}" class="text-center text-danger py-3">Failed to load datastores</td></tr>`;
            });
    }

    window.exportDatastores = function (fmt) { window.location.href = HV.exportUrl('/api/datastores/export', fmt); };

    document.addEventListener('DOMContentLoaded', () => {
        if (clusterParam) {                                   // opened from the Clusters page
            document.getElementById('clusterBanner').style.display = 'flex';
            document.getElementById('clusterBannerName').textContent = clusterParam;
            document.getElementById('clusterBannerClear').addEventListener('click', e => {
                e.preventDefault();
                const u = new URL(window.location.href); u.searchParams.delete('cluster'); window.location.href = u.toString();
            });
        }
        document.getElementById('datastoreSearch').addEventListener('input', e => { searchTerm = e.target.value.toLowerCase(); renderTable(); });
        HV.init({ pickerBox: 'runPickerBox', filterBox: 'platformFilter', envSelect: 'envSelect',
                  onRunChange: loadData, onFilterChange: renderTable }).then(loadData);
    });
})();
</script>
{% endblock %}
